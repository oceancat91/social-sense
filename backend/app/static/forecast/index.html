<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Sense · 事件热度预测</title>
  <!-- 资源走 /api/v1/forecast/asset/*：该前缀已被 Nginx 代理且继承 Basic Auth。
       不要用 /static/*：线上会落到落地页 try_files 兜底，返回 HTML 而非脚本。 -->
  <script src="/api/v1/forecast/asset/vendor/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/api/v1/forecast/asset/events.css" />
</head>
<body>
    <header class="top">
    <div class="brand">
      <span class="mark">SS</span>
      <div>
        <h1>事件热度预测 · 半衰期分析</h1>
        <p>ŷ(t) = peak · exp(−t / τ)</p>
      </div>
    </div>
    <div class="status" id="statusPill">加载中…</div>
  </header>

  <main class="grid">
    <section class="panel">
      <div class="panel-head"><h2>事件 <span id="evCount" style="opacity:.5;font-weight:400"></span></h2></div>
      <div class="ev-list" id="evList"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="chartTitle">爆发后衰减：预测 vs 真实</h2>
        <div class="badges" id="dirBadges"></div>
      </div>
      <canvas id="chart" height="118"></canvas>
      <dl class="kpi" id="kpi" style="margin-top:12px"></dl>
      <p class="note" id="caveat"></p>
    </section>

    <div class="pair">
    <section class="panel">
      <div class="panel-head"><h2>模型四分量分解</h2><div class="badges" id="compBadge"></div></div>
      <canvas id="compChart" height="104"></canvas>
      <dl class="kpi" id="compKpi" style="margin-top:12px"></dl>
      <p class="note" id="compNote"></p>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>传播时序：博文 → 评论</h2><div class="badges" id="propBadge"></div></div>
      <canvas id="propChart" height="96"></canvas>
      <dl class="kpi" id="propKpi" style="margin-top:12px"></dl>
      <p class="note" id="propNote"></p>
    </section>
    </div>

    <div class="pair">
    <section class="panel">
      <div class="panel-head"><h2>跨平台分布</h2><div class="badges" id="platBadge"></div></div>
      <div id="platBody"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>全部事件指标</h2></div>
      <div id="allTau"></div>
    </section>
    </div>
  </main>

  <script src="/api/v1/forecast/asset/events.js"></script>
</body>
</html>
