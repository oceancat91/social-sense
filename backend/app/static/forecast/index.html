<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Sense · 热度预测与归因</title>
  <!-- 资源全部走 /api/v1/forecast/asset/*：该前缀已被 Nginx 代理且继承 Basic Auth。
       不要用 /static/*：线上 /static/* 会落到落地页的 try_files 兜底，
       返回 200 但内容是 HTML，导致页面无样式、脚本不执行。
       Chart.js 与 marked 已本地化到 vendor/，不依赖 jsdelivr；
       字体走 dashboard.css 里的系统字体回退（Segoe UI / Georgia），不依赖 Google Fonts。 -->
  <script src="/api/v1/forecast/asset/vendor/chart.umd.min.js"></script>
  <script src="/api/v1/forecast/asset/vendor/marked.min.js"></script>
  <link rel="stylesheet" href="/api/v1/forecast/asset/dashboard.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <span class="mark">SS</span>
      <div>
        <h1>热度预测 · 事件归因</h1>
        <p>ŷ = T̂ + Ŝ + Ĉ + R̂ · DeepSeek 工作流</p>
      </div>
    </div>
    <div class="status" id="statusPill">加载中…</div>
  </header>

  <main class="grid">
    <section class="panel span-2">
      <div class="panel-head">
        <h2>近期热度与 6 日预测</h2>
        <div class="badges" id="dirBadges"></div>
      </div>
      <canvas id="chart" height="110"></canvas>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>模型状态</h2></div>
      <dl class="meta" id="modelMeta"></dl>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>分量（标准化空间）</h2></div>
      <canvas id="compChart" height="160"></canvas>
    </section>

    <section class="panel span-2">
      <div class="panel-head"><h2>异常事件（稳健 z）</h2></div>
      <div class="events" id="events"></div>
    </section>

    <section class="panel span-2">
      <div class="panel-head">
        <h2>AI 归因报告</h2>
        <button type="button" class="ghost" id="reloadBtn">刷新</button>
      </div>
      <article class="report" id="report"></article>
    </section>
  </main>

  <footer class="foot">
    <span>API: <code>/api/v1/forecast/*</code></span>
    <a href="/app/" target="_blank" rel="noopener">三维档案终端</a>
  </footer>

  <script src="/api/v1/forecast/asset/dashboard.js"></script>
</body>
</html>
