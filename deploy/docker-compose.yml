# 保持原仓库目录对应的项目名，迁移文件后复用已有容器和数据卷。
name: social-sense

services:
  mysql:
    image: mysql:8.0
    container_name: social-sense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ChangeMe!2024}
      MYSQL_DATABASE: social_sense
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social-sense-redis
    restart: unless-stopped

  backend:
    # 构建上下文必须是仓库根：预测功能要 workflow/ 与 social_forecast/，
    # 它们与 backend/ 同级，只给 ../backend 会 COPY 不到（原先的配置就缺这两个目录）。
    build:
      context: ..
      dockerfile: backend/Dockerfile
      # 需要预测功能时打开（CPU 版 torch 约 1 GB）：
      # args:
      #   INSTALL_FORECAST_DEPS: "1"
    container_name: social-sense-backend
    environment:
      - APP_ENV=production
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=social_sense
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-ChangeMe!2024}
      - REDIS_HOST=redis
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@social-sense.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - HF_ENDPOINT=https://hf-mirror.com
      - SENTIMENT_MODEL_NAME=lxyuan/distilbert-base-multilingual-cased-sentiments-student
      # 情感分析后端：auto（默认，向后兼容）/ llm / transformers / dict。
      # 小内存机器请显式设 dict 或 llm，避免 transformers+torch 被拉进进程。
      - SENTIMENT_BACKEND=${SENTIMENT_BACKEND:-auto}
      # 预测权重：留空则自动扫描（优先 *_numeric.pt）；生产建议显式指定到具体文件。
      - FORECAST_CHECKPOINT=${FORECAST_CHECKPOINT:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      - LLM_MAX_WORKERS=${LLM_MAX_WORKERS:-8}
      # 多 Agent 引擎：代码目录挂载 + DeepSeek 密钥
      - AGENT_ROOT=/app/agent
      - MULTIAGENT_ROOT=/app/multiagent
      - AGENT_OUTPUT_DIR=/app/agent_outputs
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # 档案阵列数据源。容器内 backend 位于 /app，而 agent 是挂载到 /app/agent 的，
      # 所以 config.py 的默认值（<仓库根>/agent/... 即 /agent/...）在容器里并不存在，
      # 会一直走快照兜底。这里显式指向挂载点，让 /api/v1/archives 按报告实时计算。
      - ARCHIVE_DATA_DIR=/app/agent/dataset/real_multiplatform/reports
      - ARCHIVE_EVAL_PATH=/app/agent/dataset/eval/evaluation_report.json
    volumes:
      - ../agent:/app/agent:ro
      - ../multiagent:/app/multiagent:ro
      - agent_outputs:/app/agent_outputs
      # 权重与数据不进镜像（.dockerignore 已排除），运行期只读挂载。
      - ../social_forecast/checkpoints:/app/social_forecast/checkpoints:ro
      - ../social_forecast/data:/app/social_forecast/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ../frontend
    container_name: social-sense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  agent_outputs:
