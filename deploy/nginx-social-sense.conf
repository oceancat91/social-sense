# =====================================================
# Social Sense 站点拓扑 v5  (Nginx >= 1.18 compatible)
#
#   socialsense.cn (443)   -> 落地页 + 分析台（静态 frontend/dist）
#   socialsense.cn (80)    -> 同一套内容，明文直出（见下方说明）
#   /app/*                 -> 分析台（Vite dist，basename /app）
#   /api/*, /health        -> Flask 后端 (:5000)
#   /forecast              -> 旧的独立仪表盘页，仍要密码（前端内已并入「预测」视图）
#   /api/v1/forecast/*     -> 公开只读（前端终端直接取数）
#   /api/v1/forecast/predict -> 仍需 HTTP Basic 密码（唯一有算力滥用风险的口子）
#   www.socialsense.cn     -> 301 跳转到根域
#
# 为什么 80 端口不再无条件跳 HTTPS：
# 域名尚未完成 ICP 备案。部分运营商会在 TLS 握手阶段按 SNI 直接重置连接
# （同一 IP 实测：SNI=IP 时 200，SNI=socialsense.cn 时 0.02 秒 RST），
# 而明文 80 只按 Host 判断、能正常到达 nginx。所以保留明文直出，让被拦截的网络
# 至少可以访问；**备案完成后应删掉 80 的服务块、恢复成强制跳转 HTTPS**。
#
# 部署:
#   sudo bash deploy/setup-forecast-auth.sh
#   sudo cp deploy/nginx-social-sense.conf /etc/nginx/sites-enabled/social-sense
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================

# HTTP：明文直出（备案前给被 SNI 拦截的网络留通路）
server {
    listen 80;
    server_name socialsense.cn;

    location / {
        root /home/ubuntu/social-sense/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /home/ubuntu/social-sense/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # 旧的独立预测页。⚠️ 明文下 Basic 认证的密码是 base64 明文传输，
    # 这是备案前的临时取舍；前端内的「预测」视图不走这里。
    location /forecast {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/forecast/predict {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/forecast/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}

# www 的 80 也跳一次，避免两个域分裂
server {
    listen 80;
    server_name www.socialsense.cn;
    return 301 http://socialsense.cn$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name socialsense.cn;

    ssl_certificate /etc/nginx/ssl/socialsense.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/socialsense.cn.key;

    location / {
        root /home/ubuntu/social-sense/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /forecast {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /home/ubuntu/social-sense/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location = /api/v1/forecast/predict {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/forecast/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}

# HTTPS www -> root 跳转
server {
    listen 443 ssl http2;
    server_name www.socialsense.cn;

    ssl_certificate /etc/nginx/ssl/socialsense.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/socialsense.cn.key;

    return 301 https://socialsense.cn$request_uri;
}
