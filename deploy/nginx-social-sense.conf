# =====================================================
# Social Sense 站点拓扑 v4  (Nginx >= 1.18 compatible)
#   socialsense.cn  (root) -> landing 落地页 (Next.js :3100)
#   /app/*                 -> 分析台 (Vite static dist, basename /app)
#   /api/*, /health        -> Flask 后端 (:5000)
#   /forecast, /api/v1/forecast/*  -> Flask 后端，额外要求 HTTP Basic 密码
#   www.socialsense.cn     -> 301 跳转到根域
#
# 部署:
#   sudo bash deploy/setup-forecast-auth.sh          # 生成预测页密码（只需一次）
#   sudo cp deploy/nginx-social-sense.conf /etc/nginx/sites-enabled/social-sense
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================

# HTTP -> HTTPS (统一跳转到根域, 避免 www 双域分裂)
server {
    listen 80;
    server_name socialsense.cn www.socialsense.cn;
    return 301 https://socialsense.cn$request_uri;
}

# HTTPS root: landing (Next.js on :3100)
server {
    listen 443 ssl http2;
    server_name socialsense.cn;

    ssl_certificate /etc/nginx/ssl/socialsense.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/socialsense.cn.key;

    # landing page
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 热度预测仪表盘（Flask，页面在 backend/app/static/forecast/）
    # 不加这条的话 /forecast 会落到上面的 landing 反代，Flask 那条路由永远到不了。
    #
    # 加密码保护的原因：这是唯一一处对外暴露模型产出的入口，而且 /status 与
    # /dashboard-data 会触发加载 954 MB 权重（常驻内存），不能允许匿名访问。
    # 账号密码文件在服务器上由 deploy/setup-forecast-auth.sh 生成，不进版本库。
    # 后端只监听 127.0.0.1:5000，nginx 是唯一入口，所以这一层就是真实边界。
    location /forecast {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 预测 API 同样要密码。
    # 这个前缀比下面的 /api/ 更长，nginx 按最长前缀匹配，会优先命中这里；
    # 其余 /api/*（登录、档案等）保持原有鉴权方式不变。
    location /api/v1/forecast/ {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # analysis dashboard static (basename /app)
    # 无尾斜杠的 /app 先 301 到 /app/，避免落入 landing 反代
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /home/ubuntu/social-sense/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Flask API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}

# HTTPS www -> root 跳转
server {
    listen 443 ssl http2;
    server_name www.socialsense.cn;

    ssl_certificate /etc/nginx/ssl/socialsense.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/socialsense.cn.key;

    return 301 https://socialsense.cn$request_uri;
}
