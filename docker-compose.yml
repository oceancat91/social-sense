version: '3.8'

services:
  backend:
    build: ./backend
    container_name: social-sense-backend
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=social_sense
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root123}
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: social-sense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: social-sense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: social_sense
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: social-sense-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql_data:
