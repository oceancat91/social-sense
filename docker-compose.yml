version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: social-sense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ChangeMe!2024}
      MYSQL_DATABASE: social_sense
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social-sense-redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: social-sense-backend
    environment:
      - APP_ENV=production
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=social_sense
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-ChangeMe!2024}
      - REDIS_HOST=redis
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@social-sense.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - HF_ENDPOINT=https://hf-mirror.com
      - SENTIMENT_MODEL_NAME=lxyuan/distilbert-base-multilingual-cased-sentiments-student
      # 多 Agent 引擎：代码目录挂载 + DeepSeek 密钥
      - AGENT_ROOT=/app/agent
      - MULTIAGENT_ROOT=/app/multiagent
      - AGENT_OUTPUT_DIR=/app/agent_outputs
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./agent:/app/agent:ro
      - ./multiagent:/app/multiagent:ro
      - agent_outputs:/app/agent_outputs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: social-sense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  agent_outputs:
