<g id="value-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="110" y="63" font-size="33" fill="#44546A" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">研究价值：从舆情监测走向社区互动</text></g><g id="value-subtitle" data-pptx-bounds="75 108 1130 48"><rect x="75" y="108" width="1130" height="48" fill="none" /><text x="80" y="139" font-size="21" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">以游戏梗文化为切入点：理解积极传播，连接创作来源、玩家表达与官方回应</text></g><g id="value-footer" data-pptx-bounds="70 680 1100 27" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="27" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="end">02 / 18</text></g><g id="positive-spread" data-pptx-bounds="65 177 735 148"><rect x="65" y="177" width="735" height="148" fill="none" /><circle cx="85" cy="199" r="19" fill="#4472C4" /><text x="85" y="206" font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">01</text><text x="120" y="208" font-size="26" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">让积极内容被理解与看见</text><text x="120" y="249" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">角色、台词与共同经历被转化为可复用的表达，<tspan x="120" dy="32.56">降低交流门槛，带动二次创作与圈层传播。</tspan><tspan x="120" dy="32.56">分析对象因此应包含内容来源、变体和互动反馈。</tspan></text></g><g id="informed-response" data-pptx-bounds="65 333 735 148"><rect x="65" y="333" width="735" height="148" fill="none" /><circle cx="85" cy="355" r="19" fill="#4472C4" /><text x="85" y="362" font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">02</text><text x="120" y="364" font-size="26" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">让官方回应更有依据</text><text x="120" y="405" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">在转发、认可或使用玩家创作前，需要核对原始<tspan x="120" dy="32.56">语境、作者与改编链，区分友好调侃和真实不满；</tspan><tspan x="120" dy="32.56">这些信息可为素材支持、互动回应提供参考。</tspan></text></g><g id="community-trust" data-pptx-bounds="65 489 735 148"><rect x="65" y="489" width="735" height="148" fill="none" /><circle cx="85" cy="511" r="19" fill="#4472C4" /><text x="85" y="518" font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">03</text><text x="120" y="520" font-size="26" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">让社区维护兼顾参与和信任</text><text x="120" y="561" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">保留出处、解释立场差异，有助于呈现真实诉求、<tspan x="120" dy="32.56">认可创作者贡献，并减少脱离语境的误判。</tspan><tspan x="120" dy="32.56">正向互动的收益仍需试用与对照评估来验证。</tspan></text></g><g id="contest-evidence" data-pptx-bounds="837 171 365 498"><rect x="837" y="171" width="365" height="498" fill="none" /><image href="../images/summer_key_visual.jpg" x="855" y="175" width="330" height="440" preserveAspectRatio="xMidYMid meet" /><text x="851" y="639" font-size="16" fill="#4472C4" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start"><a href="https://www.taptap.cn/moment/832223722998859956"><tspan text-decoration="underline">[W2] TapTap 创作征集活动原图</tspan></a></text><text x="851" y="664" font-size="16" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">公开案例：征集二创、攻略与体验分享</text></g><g id="value-evidence" data-pptx-bounds="70 643 740 27"><rect x="70" y="643" width="740" height="27" fill="none" /><text x="80" y="663" font-size="16" fill="#4472C4" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start"><a href="https://www.taptap.cn/moment/834126362733185189"><tspan text-decoration="underline">[W1] 官方素材分享</tspan></a></text><text x="265" y="663" font-size="16" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">公开案例说明应用需求，不代表已验证的传播增益</text></g></svg>