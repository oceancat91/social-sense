<g id="value-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="110" y="63" font-size="33" fill="#44546A" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">支持正向互动，先让结论经得起复核</text></g><g id="value-subtitle" data-pptx-bounds="75 108 1130 48"><rect x="75" y="108" width="1130" height="48" fill="none" /><text x="80" y="139" font-size="21" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">“笑飞了”可能是赞赏，也可能是反讽；识别表达对象和语境，才能减少回应误判</text></g><g id="value-footer" data-pptx-bounds="70 680 1100 27" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="27" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="end">05 / 18</text></g><g id="review-flow" data-pptx-bounds="65 180 340 472"><rect x="65" y="180" width="340" height="472" fill="none" /><rect x="76" y="184" width="318" height="74" fill="#EDF2F8" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="235" y="231" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">原句、上下文与来源</text><line x1="235" y1="258" x2="235" y2="294" stroke="#4472C4" stroke-width="2" /><rect x="76" y="294" width="318" height="74" fill="#EDF2F8" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="235" y="341" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">形成候选态度判断</text><line x1="235" y1="368" x2="235" y2="404" stroke="#4472C4" stroke-width="2" /><rect x="76" y="404" width="318" height="74" fill="#EDF2F8" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="235" y="451" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">规则核验与受限改写</text><line x1="235" y1="478" x2="235" y2="514" stroke="#4472C4" stroke-width="2" /><rect x="76" y="514" width="318" height="74" fill="#EDF2F8" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="235" y="561" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">保留依据与不确定性</text><text x="83" y="631" font-size="21" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">目的：减少脱离语境的强判断</text></g><g id="gates-single" data-pptx-bounds="440 180 770 211"><rect x="440" y="180" width="770" height="211" fill="none" /><rect x="440" y="180" width="770" height="211" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="464" y="220" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">G1—G7：单平台结论与观测一致</text><text x="464" y="267" font-size="23" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">核对趋势、情绪、立场、引用标识、数值边界，<tspan x="464" dy="34.04">检查空窗表述以及风险判断是否有观测依据。</tspan><tspan x="464" dy="34.04">它能暴露结构性矛盾，不等于理解全部梗义与反讽。</tspan></text></g><g id="gates-cross" data-pptx-bounds="440 411 770 211"><rect x="440" y="411" width="770" height="211" fill="none" /><rect x="440" y="411" width="770" height="211" fill="#FFFFFF" stroke="#0D3745" stroke-width="1.2" rx="6" ry="6" /><text x="464" y="451" font-size="27" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">CX1—CX5：跨平台汇总不掩盖分歧</text><text x="464" y="498" font-size="23" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">核对平台覆盖、分歧表述和引用平台的有效性，<tspan x="464" dy="34.04">每条断言绑定平台；全空数据不生成强结论。</tspan><tspan x="464" dy="34.04">引用存在不代表内容支持结论，仍须回看原文。</tspan></text></g><g id="response-use" data-pptx-bounds="440 636 768 29"><rect x="440" y="636" width="768" height="29" fill="none" /><text x="452" y="657" font-size="21" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">应用意义：让社区团队看见不同声音，保留可复核的回应依据。</text></g></svg>