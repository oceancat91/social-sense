<g id="value-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="110" y="63" font-size="33" fill="#44546A" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">热度预测：区分长期积累与突然走红</text></g><g id="value-subtitle" data-pptx-bounds="75 108 1130 48"><rect x="75" y="108" width="1130" height="48" fill="none" /><text x="80" y="139" font-size="21" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">四分量是建模假设；不把热度上涨直接解释为官方回应的因果效果</text></g><g id="value-footer" data-pptx-bounds="70 680 1100 27" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="27" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="end">06 / 18</text></g><g id="decomposition-model" data-pptx-bounds="65 181 495 469"><rect x="65" y="181" width="495" height="469" fill="none" /><rect x="65" y="181" width="495" height="469" fill="#EDF2F8" /><text x="312" y="226" font-size="29" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">输入热度 x</text><text x="312" y="276" font-size="32" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">x = T + S + C + R</text><g><rect x="84" y="312" width="106" height="91" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="5" ry="5" /><text x="137" y="347" font-size="22" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">T 趋势</text><text x="137" y="382" font-size="17" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="middle">EMA</text></g><g><rect x="201" y="312" width="106" height="91" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="5" ry="5" /><text x="254" y="347" font-size="22" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">S 季节</text><text x="254" y="382" font-size="17" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="middle">Fourier</text></g><g><rect x="318" y="312" width="106" height="91" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="5" ry="5" /><text x="371" y="347" font-size="22" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">C 冲击</text><text x="371" y="382" font-size="17" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="middle">事件信号</text></g><g><rect x="435" y="312" width="106" height="91" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="5" ry="5" /><text x="488" y="347" font-size="22" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">R 剩余</text><text x="488" y="382" font-size="17" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="middle">代数剩余项</text></g><text x="312" y="451" font-size="26" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">四路编码 → 稀疏专家融合</text><text x="312" y="494" font-size="24" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="middle">预测增量 → 累加回水平域</text><text x="312" y="539" font-size="25" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="middle">过去 28 天 → 未来 6 天</text><line x1="87" y1="564" x2="538" y2="564" stroke="#CED9E6" stroke-width="1" /><text x="88" y="597" font-size="21" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">研究用途：辅助观察话题是否持续，<tspan x="88" dy="31.5">为后续复核和社区互动研究安排时间窗。</tspan></text></g><g id="forecast-detail-0" data-pptx-bounds="600 181 610 111"><rect x="600" y="181" width="610" height="111" fill="none" /><text x="610" y="210" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">按结构分别编码</text><text x="610" y="248" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">线性 / PatchCNN / 稀疏事件 / 轻量 SSM；<tspan x="610" dy="31.9">分别处理趋势、周期、冲击和其余波动。</tspan></text><line x1="610" y1="291" x2="1200" y2="291" stroke="#D8E0EB" stroke-width="1" /></g><g id="forecast-detail-1" data-pptx-bounds="600 300 610 111"><rect x="600" y="300" width="610" height="111" fill="none" /><text x="610" y="329" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">四路数值表征参与路由</text><text x="610" y="367" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">默认 top-k = 2 进行专家选择；<tspan x="610" dy="31.9">融合权重是否有效，需要消融实验验证。</tspan></text><line x1="610" y1="410" x2="1200" y2="410" stroke="#D8E0EB" stroke-width="1" /></g><g id="forecast-detail-2" data-pptx-bounds="600 419 610 111"><rect x="600" y="419" width="610" height="111" fill="none" /><text x="610" y="448" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">文本增量是可选路径</text><text x="610" y="486" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">完整模型有门控文本分支；现有部署验证<tspan x="610" dy="31.9">关闭文本，不能推断已读懂游戏梗与图像。</tspan></text><line x1="610" y1="529" x2="1200" y2="529" stroke="#D8E0EB" stroke-width="1" /></g><g id="forecast-detail-3" data-pptx-bounds="600 538 610 111"><rect x="600" y="538" width="610" height="111" fill="none" /><text x="610" y="567" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">预测与传播解释分别评价</text><text x="610" y="605" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">下页为既有数据实测，不是方舟社区实验；<tspan x="610" dy="31.9">跨话题泛化及回应效果仍需独立评估。</tspan></text></g></svg>