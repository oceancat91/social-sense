<g id="value-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="110" y="63" font-size="33" fill="#44546A" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">差异化定位：面向游戏社区的来源与互动研究</text></g><g id="value-subtitle" data-pptx-bounds="75 108 1130 48"><rect x="75" y="108" width="1130" height="48" fill="none" /><text x="80" y="139" font-size="21" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">比较的是研究切入点；优势需要同口径评价，不预设功能或性能全面领先</text></g><g id="value-footer" data-pptx-bounds="70 680 1100 27" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="27" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="end">09 / 18</text></g><g id="market-capabilities" data-pptx-bounds="65 180 550 372"><rect x="65" y="180" width="550" height="372" fill="none" /><rect x="65" y="180" width="550" height="372" fill="#EDF2F8" /><text x="90" y="223" font-size="28" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">成熟产品的公开能力</text><text x="90" y="275" font-size="24" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">新浪舆情通提供监测和预警，已覆盖<tspan x="90" dy="37.2">微博 / 新闻溯源、传播效果与品牌洞察。</tspan><tspan x="90" dy="37.2">其公开产品也已使用多智能体分析。</tspan></text><text x="90" y="407" font-size="23" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">差异化需要落实到具体任务的评价：<tspan x="90" dy="34.5">围绕来源证据、同源变体与复核效率，</tspan><tspan x="90" dy="34.5">检验游戏社区这一垂直场景的研究收益。</tspan></text><text x="90" y="535" font-size="17" fill="#4472C4" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start"><a href="https://yuqing.sina.com/undefined/about"><tspan text-decoration="underline">[W3] 官方产品介绍</tspan></a></text><text x="295" y="535" font-size="17" fill="#4472C4" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start"><a href="https://files.yqt365.com/fileOnline/instruction.html"><tspan text-decoration="underline">[W4] 信息溯源说明</tspan></a></text></g><g id="research-difference" data-pptx-bounds="650 180 560 372"><rect x="650" y="180" width="560" height="372" fill="none" /><text x="670" y="223" font-size="28" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">本项目拟突出的研究切入点</text><text x="672" y="266" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">来源与创作认可</text><text x="672" y="302" font-size="20.5" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">追踪同源梗的改写和引用，保留创作者与语境。</text><text x="672" y="360" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">立场与互动时机</text><text x="672" y="396" font-size="20.5" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">结合平台分歧和热度，辅助发现参与与误读线索。</text><text x="672" y="454" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">回应与反馈评价</text><text x="672" y="490" font-size="20.5" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">关联官方回应和后续互动，检验是否改善交流。</text></g><g id="light-application-outlook" data-pptx-bounds="70 576 1135 87"><rect x="70" y="576" width="1135" height="87" fill="none" /><rect x="70" y="576" width="1135" height="87" fill="#EDF2F8" /><text x="92" y="610" font-size="23" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">应用展望（后续）</text><text x="305" y="610" font-size="23" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">可面向游戏社区团队提供试点工具或专题报告。</text><text x="92" y="646" font-size="21" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">先验证溯源质量、语境判断和人工复核效率，再评估服务方式；当前以创新训练和技术验证为主。</text></g></svg>