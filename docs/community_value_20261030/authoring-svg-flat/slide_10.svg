<g id="value-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="110" y="63" font-size="33" fill="#44546A" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">中期进展：四条主线成型，关键验证待补齐</text></g><g id="value-subtitle" data-pptx-bounds="75 108 1130 48"><rect x="75" y="108" width="1130" height="48" fill="none" /><text x="80" y="139" font-size="21" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">按仓库实现与研究记录报告状态；由五名成员围绕可检查交付物协作</text></g><g id="value-footer" data-pptx-bounds="70 680 1100 27" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="27" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="end">10 / 18</text></g><g id="progress-0" data-pptx-bounds="65 178 557 151"><rect x="65" y="178" width="557" height="151" fill="none" /><rect x="65" y="178" width="557" height="151" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="85" y="215" font-size="26" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">01 数据接入与标准化</text><text x="85" y="260" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">已有适配接口、清洗与平台报告契约；<tspan x="85" dy="34.1">逐平台稳定性和来源元数据仍需核查。</tspan></text></g><g id="progress-1" data-pptx-bounds="653 178 557 151"><rect x="653" y="178" width="557" height="151" fill="none" /><rect x="653" y="178" width="557" height="151" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="673" y="215" font-size="26" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">02 跨平台分析与校准</text><text x="673" y="260" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">已实现时间对齐、差异汇总及 G/CX 规则；<tspan x="673" dy="34.1">语义同事件对齐、梗义判断仍需标注样本。</tspan></text></g><g id="progress-2" data-pptx-bounds="65 347 557 151"><rect x="65" y="347" width="557" height="151" fill="none" /><rect x="65" y="347" width="557" height="151" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="85" y="384" font-size="26" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">03 辅助预测与部署</text><text x="85" y="429" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">已训练四分量模型，完成 CPU 数值包验证；<tspan x="85" dy="34.1">误差尚未优于持续值，文本收益和泛化待测。</tspan></text></g><g id="progress-3" data-pptx-bounds="653 347 557 151"><rect x="653" y="347" width="557" height="151" fill="none" /><rect x="653" y="347" width="557" height="151" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="6" ry="6" /><text x="673" y="384" font-size="26" fill="#4472C4" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">04 交互与研究记录</text><text x="673" y="429" font-size="22" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">已有三维档案入口、详情页和运行截图；<tspan x="673" dy="34.1">线上全链路联调与用户试用待补齐。</tspan></text></g><g id="member-work" data-pptx-bounds="70 536 1130 136"><rect x="70" y="536" width="1130" height="136" fill="none" /><text x="87" y="564" font-size="24" fill="#0D3745" font-family="Microsoft YaHei" font-weight="bold" text-anchor="start">成员协作与交付</text><text x="87" y="599" font-size="21.5" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">张艺嘉：架构、模型与联调  ·  王悦：数据质量  ·  郑锦凡：基线与误差分析</text><text x="87" y="632" font-size="21" fill="#243446" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">詹江叶煜：事件对齐与传播关系  ·  吴珂欣：档案交互  ·  共同补齐：样本、评估表和试用记录</text><text x="87" y="659" font-size="18" fill="#64748B" font-family="Microsoft YaHei" font-weight="normal" text-anchor="start">当前未形成已验证的完整图溯源成果；正式成果状态以申请回执和验收记录为准。</text></g></svg>