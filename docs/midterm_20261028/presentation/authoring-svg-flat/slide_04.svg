<text x="132.27" y="274.90194226" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1"><tspan>近年来，影视、游戏产业已经与年轻群体的生活密不可分</tspan><tspan x="132.27" dy="32">，同时人们也对电影和游戏里的画面质量的要求也越来越</tspan><tspan x="132.27" dy="32">高。传统的</tspan><tspan>2D</tspan><tspan>动画和过去几年的</tspan><tspan>3D</tspan><tspan>动画呈现出来的表达效</tspan><tspan x="132.27" dy="32">果仍缺乏表现力，渐渐不再能满足用户的需求。</tspan><tspan x="132.27" dy="32" /></text>
<text x="132.27" y="434.90194226" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" font-weight="bold" data-pptx-text-baseline="metrics-v1"><tspan>4D</tspan><tspan>内容生成技术</tspan><tspan>的出现使得人们既可以播放物体的动态效</tspan><tspan x="132.27" dy="32">果，也可以观察某一时刻下该物体的全方位姿态，极大丰</tspan><tspan x="132.27" dy="32">富了影视与游戏画面的表达效果；</tspan></text>
<text x="132.27" y="530.90194226" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1"><tspan>同时，这项技术也能为虚拟现实（</tspan><tspan>VR</tspan><tspan>）、增强现实（</tspan><tspan>AR</tspan><tspan>）</tspan><tspan x="132.27" dy="32">等沉浸式体验提供具有连续空间与时间变化的交互式动态</tspan><tspan x="132.27" dy="32">三维场景，进而为文旅、医疗健康、智能制造等行业进行</tspan><tspan x="132.27" dy="32">技术赋能。</tspan></text>
</g>
</g>
