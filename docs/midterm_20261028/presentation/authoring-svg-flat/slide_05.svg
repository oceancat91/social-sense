<text x="608.98" y="350.02855643" text-anchor="start" xml:space="preserve" font-size="25.07" fill="#262626" font-weight="bold" data-pptx-text-baseline="metrics-v1">难题一：空间补全</text>
<text x="608.98" y="385.8152231" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1"><tspan>•  </tspan><tspan>单张图片或单视角视频仅包含已知视角的信息；</tspan></text>
<text x="608.98" y="417.8152231" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1"><tspan>•  </tspan><tspan>生成系统必须凭空推断并补充被遮挡区域、侧面以及背面的</tspan><tspan x="608.98" dy="32">三维几何形状与外观细节。若缺乏有效的空间约束，极易产生不</tspan><tspan x="608.98" dy="32">同视角互相冲突的现象。（</tspan><tspan>Janus </tspan><tspan>多面问题）</tspan></text>
</g>
<g id="shape-17" data-pptx-object="shape" data-pptx-frame="599.38 500.28 621.54 201.26" data-pptx-prst="rect" data-pptx-source-ref="slide:17">

<path d="M 599.38 500.28 L 1220.92 500.28 L 1220.92 701.54 L 599.38 701.54 Z" fill="none" />


<text x="608.98" y="529.07821522" text-anchor="start" xml:space="preserve" font-size="25.07" fill="#262626" font-weight="bold" data-pptx-text-baseline="metrics-v1">难题二：运动生成</text>
<text x="608.98" y="561.07821522" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1"><tspan>•  </tspan><tspan>单张静态图片缺乏时间信息，无法预测物体未来的动态行为</tspan><tspan x="608.98" dy="32">；而单视角视频虽有动作参照，却缺少其他角度的运动表现；</tspan></text>
<text x="608.98" y="625.07821522" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1"><tspan>•  </tspan><tspan>系统需要为静态对象赋予自然流畅、符合物理规律的动态形</tspan><tspan x="608.98" dy="32">变。</tspan></text>
</g>
