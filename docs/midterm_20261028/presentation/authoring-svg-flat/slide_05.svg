<text x="654.76" y="253.50887139" text-anchor="start" xml:space="preserve" font-size="22" fill="#262626" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="32"><tspan><tspan>当前，</tspan><tspan>4D</tspan><tspan>生成技术的研究已持续多年，但是</tspan><tspan font-weight="bold">空间补全</tspan><tspan>与</tspan><tspan font-weight="bold">运</tspan></tspan><tspan font-weight="bold" data-paragraph-line-break="1">动生成<tspan>仍然是这项技术的两大瓶颈。</tspan></tspan></text>
</g>
