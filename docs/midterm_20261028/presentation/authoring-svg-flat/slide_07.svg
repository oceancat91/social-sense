<text x="76.87" y="608.26288714" text-anchor="start" xml:space="preserve" font-size="22" fill="#000000" data-pptx-text-baseline="metrics-v1"><tspan>变</tspan><tspan>C</tspan><tspan>，可以从不同角度观察同一姿态；固定</tspan><tspan>C</tspan><tspan>、改变</tspan></text>
<text x="76.87" y="637.59622047" text-anchor="start" xml:space="preserve" font-size="22" fill="#000000" data-pptx-text-baseline="metrics-v1"><tspan>t</tspan><tspan>，可以观看同一视角下的连续动作。</tspan></text>
</g>
