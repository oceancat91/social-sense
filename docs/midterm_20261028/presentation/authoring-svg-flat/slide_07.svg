<text x="124.87" y="336.49228346" text-anchor="start" xml:space="preserve" font-size="22" fill="#000000" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="32"><tspan><tspan>其中，</tspan><tspan font-weight="bold">c</tspan><tspan>表示给定的文字、图像、单视角视频或三维模型等</tspan></tspan><tspan data-paragraph-line-break="1">输入条件，<tspan> </tspan><tspan font-weight="bold">G</tspan><tspan>表示从输入到动态三维内容的完整流程的映射</tspan></tspan><tspan data-paragraph-line-break="1">，<tspan font-weight="bold">ξ</tspan><tspan>表示生成过程中的随机性，</tspan><tspan font-weight="bold">S</tspan><tspan>为动态三维结果，</tspan><tspan font-weight="bold">S(t)</tspan><tspan> </tspan><tspan>为</tspan></tspan><tspan data-paragraph-line-break="1">其在选定时刻<tspan>t</tspan><tspan>的状态。</tspan><tspan font-weight="bold">C</tspan><tspan> </tspan><tspan>包含观察相机的位置、朝向与成</tspan></tspan><tspan data-paragraph-line-break="1">像参数，<tspan font-weight="bold">R</tspan><tspan>将该时刻的三维状态渲染为画面</tspan><tspan font-weight="bold">I(</tspan><tspan font-weight="bold">C,t</tspan><tspan font-weight="bold">)</tspan><tspan>。</tspan></tspan></text>
</g>
