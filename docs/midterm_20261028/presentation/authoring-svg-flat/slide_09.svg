</g>
<g id="shape-9" data-pptx-object="shape" data-pptx-frame="562.56 151.68 660.48 46.11" data-pptx-prst="rect" data-pptx-source-ref="slide:9" data-pptx-semantic-object="shape">
<path d="M 562.56 151.68 L 1223.04 151.68 L 1223.04 197.79 L 562.56 197.79 Z" fill="none" data-pptx-part="geometry" />


<text x="563.52" y="169.49333333" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>① </tspan><tspan fill="#252525">NeRF</tspan><tspan fill="#252525"> 参数 </tspan><tspan fill="#252525">θ </tspan><tspan fill="#252525">在随机相机 </tspan><tspan fill="#252525">C </tspan><tspan fill="#252525">下渲染当前图像：</tspan><tspan fill="#252525">x</tspan><tspan fill="#252525"> </tspan><tspan fill="#252525">= R(θ, C)</tspan><tspan fill="#252525">。 随机采样相机使</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">同一组 <tspan>NeRF</tspan><tspan> 参数反复接受不同方向的渲染检验。</tspan></tspan></text>
</g>
<g id="shape-10" data-pptx-object="shape" data-pptx-frame="562.56 213.12 660.48 46.11" data-pptx-prst="rect" data-pptx-source-ref="slide:10" data-pptx-semantic-object="shape">
<path d="M 562.56 213.12 L 1223.04 213.12 L 1223.04 259.23 L 562.56 259.23 Z" fill="none" data-pptx-part="geometry" />


<text x="563.52" y="230.93333333" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>② </tspan><tspan fill="#252525">对渲染图加噪得到 </tspan><tspan fill="#252525">zₜ</tspan><tspan fill="#252525">，再由冻结的 </tspan><tspan fill="#252525">U-Net </tspan><tspan fill="#252525">预测噪声 </tspan><tspan fill="#252525">ε̂φ</tspan><tspan fill="#252525">。 </tspan><tspan fill="#252525">U-Net </tspan><tspan fill="#252525">提供图像</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">先验反馈，不直接输出最终网格或高斯。</tspan></text>
</g>
<g id="shape-11" data-pptx-object="shape" data-pptx-frame="562.56 279.36 660.48 46.11" data-pptx-prst="rect" data-pptx-source-ref="slide:11" data-pptx-semantic-object="shape">
<path d="M 562.56 279.36 L 1223.04 279.36 L 1223.04 325.47 L 562.56 325.47 Z" fill="none" data-pptx-part="geometry" />


<text x="563.52" y="297.17333333" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>③ </tspan><tspan fill="#252525">噪声残差形成更新信号，经渲染链反传到 </tspan><tspan fill="#252525">θ</tspan><tspan fill="#252525">；扩散模型本身不更新。 因而监督</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">是间接的：误差信号必须经过可微渲染链回到三维参数。</tspan></text>
</g>
