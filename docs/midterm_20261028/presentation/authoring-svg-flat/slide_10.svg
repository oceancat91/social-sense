</g>
<g id="shape-16" data-pptx-object="shape" data-pptx-frame="59.52 598.34 645.12 67.2" data-pptx-prst="rect" data-pptx-source-ref="slide:16" data-pptx-semantic-object="shape">
<path d="M 59.52 598.34 L 704.64 598.34 L 704.64 665.54 L 59.52 665.54 Z" fill="none" data-pptx-part="geometry" />


<text x="59.52" y="615.67013123" text-anchor="start" xml:space="preserve" font-size="17.47" fill="#1F2326" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="20.96"><tspan><tspan>ΔR </tspan><tspan>指定相对旋转，ΔT</tspan><tspan> </tspan><tspan>指定相对平移。它们把“从哪里看”变成明确输入，但模型仍</tspan></tspan><tspan data-paragraph-line-break="1">然是在生成新图像，而不是直接输出一个封闭、可编辑的三维几何体<tspan>。</tspan></tspan></text>
</g>
<g id="shape-17" data-pptx-object="shape" data-pptx-frame="724.8 114.03 468.48 38.4" data-pptx-prst="rect" data-pptx-source-ref="slide:17" data-pptx-semantic-object="shape">
