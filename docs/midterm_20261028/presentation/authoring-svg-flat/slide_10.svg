<text x="741.77" y="617.5047769" text-anchor="start" xml:space="preserve" font-size="16.8" fill="#1F2326" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="20.16"><tspan><tspan>演进意义：相机条件解决“看哪里”，多视角联合先验尝试解决</tspan></tspan><tspan data-paragraph-line-break="1">“不同角度是否仍是同一个对象”。但一致性仍是学习到的先验</tspan><tspan data-paragraph-line-break="1">约束，而非硬性的几何保证。</tspan></text>
