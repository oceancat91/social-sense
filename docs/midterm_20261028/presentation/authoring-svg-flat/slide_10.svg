</g>
<g id="shape-18" data-pptx-object="shape" data-pptx-frame="716.96 155.27 462.72 68.73" data-pptx-prst="rect" data-pptx-source-ref="slide:18" data-pptx-semantic-object="shape">
<path d="M 716.96 155.27 L 1179.68 155.27 L 1179.68 224 L 716.96 224 Z" fill="none" data-pptx-part="geometry" />


<text x="717.92" y="173.08115486" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>① </tspan><tspan fill="#252525">Zero-1-to-3 </tspan><tspan fill="#252525">将参考 </tspan><tspan fill="#252525">RGB </tspan><tspan fill="#252525">图像与相对相机变换作为</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">条件，生成指定角度的新视图。 相对位姿明确指定目标</tspan><tspan fill="#252525" data-paragraph-line-break="1">相机相对于输入相机的变化。</tspan></text>
</g>
<g id="shape-19" data-pptx-object="shape" data-pptx-frame="723.84 232.19 462.72 68.73" data-pptx-prst="rect" data-pptx-source-ref="slide:19" data-pptx-semantic-object="shape">
<path d="M 723.84 232.19 L 1186.56 232.19 L 1186.56 300.92 L 723.84 300.92 Z" fill="none" data-pptx-part="geometry" />


<text x="724.8" y="250.00724409" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>② </tspan><tspan fill="#252525">相机条件把观察方向变成显式输入，而不是让模型自</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">行猜测视角。 这把视角变化从隐含因素变成显式条件，</tspan><tspan fill="#252525" data-paragraph-line-break="1">提高了生成的可控性。</tspan></text>
</g>
<g id="shape-20" data-pptx-object="shape" data-pptx-frame="716.96 310.27 462.72 67.76" data-pptx-prst="rect" data-pptx-source-ref="slide:20" data-pptx-semantic-object="shape">
<path d="M 716.96 310.27 L 1179.68 310.27 L 1179.68 378.03 L 716.96 378.03 Z" fill="none" data-pptx-part="geometry" />


<text x="717.92" y="328.08146982" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.4" fill="#BE1F26" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.08"><tspan><tspan>③  </tspan><tspan fill="#1F2326">MVDream</tspan><tspan fill="#1F2326"> </tspan><tspan fill="#1F2326">进一步在共同去噪过程中联合处理多个视角</tspan></tspan><tspan fill="#1F2326" data-paragraph-line-break="1">，并通过跨视角注意力交换信息，减少单视角先验造成的</tspan><tspan fill="#1F2326" data-paragraph-line-break="1"> Janus <tspan>问题</tspan><tspan>。</tspan></tspan></text>
</g>
