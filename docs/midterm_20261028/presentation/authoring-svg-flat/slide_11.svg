</g>
<g id="shape-18" data-pptx-object="shape" data-pptx-frame="743.34 156.48 497.31 68.73" data-pptx-prst="rect" data-pptx-source-ref="slide:18" data-pptx-semantic-object="shape">
<path d="M 743.34 156.48 L 1240.66 156.48 L 1240.66 225.21 L 743.34 225.21 Z" fill="none" data-pptx-part="geometry" />


<text x="744.3" y="174.29333333" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>① </tspan><tspan fill="#252525">DreamFusion</tspan><tspan fill="#252525"> 优化静态 </tspan><tspan fill="#252525">NeRF</tspan><tspan fill="#252525">；</tspan><tspan fill="#252525">MAV3D </tspan><tspan fill="#252525">将时间 </tspan><tspan fill="#252525">t </tspan><tspan fill="#252525">加入场</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">景查询，描述同一对象在不同时间的状态。 因此，时间不是</tspan><tspan fill="#252525" data-paragraph-line-break="1">单纯的播放序号，而是参与空间查询的输入变量。</tspan></text>
</g>
<g id="shape-19" data-pptx-object="shape" data-pptx-frame="743.34 235.2 491.02 68.73" data-pptx-prst="rect" data-pptx-source-ref="slide:19" data-pptx-semantic-object="shape">
<path d="M 743.34 235.2 L 1234.36 235.2 L 1234.36 303.93 L 743.34 303.93 Z" fill="none" data-pptx-part="geometry" />


<text x="744.3" y="253.01333333" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>② </tspan><tspan fill="#252525">系统渲染多帧与随机视角，视频扩散模型为运动、外观和</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">文本一致性提供反馈。 这避免把每一帧当成独立图像，但</tspan><tspan fill="#252525" data-paragraph-line-break="1">仍依赖视频模型学到的统计先验。</tspan></text>
</g>
<g id="shape-20" data-pptx-object="shape" data-pptx-frame="743.34 317.76 479.7 68.73" data-pptx-prst="rect" data-pptx-source-ref="slide:20" data-pptx-semantic-object="shape">
<path d="M 743.34 317.76 L 1223.04 317.76 L 1223.04 386.49 L 743.34 386.49 Z" fill="none" data-pptx-part="geometry" />


<text x="744.3" y="335.57333333" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#B91F25" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>③ </tspan><tspan fill="#252525">视频生成器相当于一种“统计多相机监督”：不同帧和视</tspan></tspan><tspan fill="#252525" data-paragraph-line-break="1">角共同帮助优化动态场景。 这种监督并非真实多机位观测</tspan><tspan fill="#252525" data-paragraph-line-break="1">，背面与遮挡区域仍存在不确定性。</tspan></text>
</g>
<g id="shape-21" data-pptx-object="shape" data-pptx-frame="761.28 405.12 458.88 32.64" data-pptx-prst="rect" data-pptx-source-ref="slide:21" data-pptx-semantic-object="shape">
<path d="M 761.28 405.12 L 1220.16 405.12 L 1220.16 437.76 L 761.28 437.76 Z" fill="none" data-pptx-part="geometry" />


<text x="761.28" y="425.12" text-anchor="start" xml:space="preserve" font-size="20.4" fill="#BE1F26" font-weight="bold" data-pptx-text-baseline="metrics-v1">真正的 4D 不等于把图片排成视频</text>
</g>
<g id="shape-22" data-pptx-object="shape" data-pptx-frame="761.28 441.6 458.88 127.68" data-pptx-prst="roundRect" data-pptx-source-ref="slide:22" data-pptx-semantic-object="shape">
<path d="M 761.28 462.88 A 21.28 21.28 0 0 1 782.56 441.6 L 1198.88 441.6 A 21.28 21.28 0 0 1 1220.16 462.88 L 1220.16 548 A 21.28 21.28 0 0 1 1198.88 569.28 L 782.56 569.28 A 21.28 21.28 0 0 1 761.28 548 Z" fill="#FBEFEF" stroke-width="1.06667" stroke="#BE1F26" data-pptx-part="geometry" />


<text x="768" y="462.62929134" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#252525" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="22.4"><tspan><tspan>关键是同一个 </tspan><tspan>fθ</tspan><tspan>(</tspan><tspan>x,y,z,t</tspan><tspan>) </tspan><tspan>能解释各个时刻的空间</tspan></tspan><tspan data-paragraph-line-break="1">外观。遗留问题是 <tspan>T2V </tspan><tspan>先验可能带来细节</tspan><tspan>/</tspan><tspan>几何伪影</tspan></tspan><tspan data-paragraph-line-break="1">，逐场景优化也较慢；外观、结构和动作仍难同时稳</tspan><tspan data-paragraph-line-break="1">定。 评价时应同时固定相机检查运动连续性、固定时</tspan><tspan data-paragraph-line-break="1">刻检查跨视角一致性。</tspan></text>
</g>
<g id="shape-23" data-pptx-object="shape" data-pptx-frame="761.28 577.92 458.88 63.36" data-pptx-prst="rect" data-pptx-source-ref="slide:23" data-pptx-semantic-object="shape">
<path d="M 761.28 577.92 L 1220.16 577.92 L 1220.16 641.28 L 761.28 641.28 Z" fill="none" data-pptx-part="geometry" />


<text x="762.24" y="594.447979" text-anchor="start" xml:space="preserve" font-size="17.07" fill="#1F2326" font-weight="bold" data-pptx-text-baseline="metrics-v1" data-pptx-text-model="lines" data-paragraph-line-height="20.48"><tspan><tspan>局限：视频扩散先验不直接提供真实的背面与遮挡标注；4D </tspan></tspan><tspan data-paragraph-line-break="1">参数量和迭代优化成本也会随时间维度显著增加<tspan>。</tspan></tspan></text>
</g></svg>
