<text x="176.23" y="231.75412073" text-anchor="start" xml:space="preserve" font-size="22" fill="#000000" data-pptx-text-baseline="metrics-v1"><tspan>项目拟交付一份融合技术演进与案</tspan><tspan x="176.23" dy="40">例分析的</tspan><tspan font-weight="bold">综述报告</tspan><tspan>、一个交互式</tspan><tspan font-weight="bold">可</tspan><tspan x="176.23" dy="40" font-weight="bold">视化原型</tspan><tspan>及其代码、一组三个案例</tspan><tspan x="176.23" dy="40">的</tspan><tspan font-weight="bold">观察记录</tspan><tspan>，以及</tspan><tspan font-weight="bold">答辩材料</tspan><tspan>。</tspan></text>
<text x="176.23" y="399.75412073" text-anchor="start" xml:space="preserve" font-size="22" fill="#767171" data-pptx-text-baseline="metrics-v1"><tspan>报告将在已有技术树和方法对照的</tspan><tspan x="176.23" dy="40">基础上，形成关于一致性来源、能</tspan><tspan x="176.23" dy="40">力边界与使用取舍的讨论；观察记</tspan><tspan x="176.23" dy="40">录将给出问题、关键画面、机制解</tspan><tspan x="176.23" dy="40">释和待验证之处，支撑这些判断。</tspan></text>
</g>
