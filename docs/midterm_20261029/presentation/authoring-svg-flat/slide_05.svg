i" text-anchor="start" font-weight="bold">02 跨平台分析</text><text x="94" y="495" font-size="19" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">已实现时间对齐与差异汇总<tspan x="94" dy="29.45">语义级同事件对齐待完成</tspan></text></g><g id="forecast" data-pptx-bounds="410 180 322 200"><rect x="410" y="180" width="322" height="200" fill="none" /><rect x="410" y="180" width="322" height="200" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="8" ry="8" /><line x1="413" y1="183" x2="413" y2="377" stroke="#4472C4" stroke-width="5" /><text x="434" y="220" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">03 辅助预测</text><text x="434" y="265" font-size="19" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">已训练四分量模型并验证数值包<tspan x="434" dy="29.45">误差、泛化与误报仍需改进</tspan></text></g><g id="ui" data-pptx-bounds="410 410 322 200"><rect x="410" y="410" width="322" height="200" fill="none" /><rect x="410" y="410" width="322" height="200" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="8" ry="8" /><line x1="413" y1="413" x2="413" y2="607" stroke="#4472C4" stroke-width="5" /><text x="434" y="450" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">04 可视化与报告</text><text x="434" y="495" font-size="19" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">已有档案浏览、详情及规则校准<tspan x="434" dy="29.45">线上联调与用户试用待补齐</tspan></text></g><g id="pending-tracing" data-pptx-bounds="775 180 435 430"><rect x="775" y="180" width="435" height="430" fill="none" /><rect x="775" y="180" width="435" height="430" fill="#EDF2F8" /><text x="805" y="229" font-size="29" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">05 传播路径溯源</text><text x="805" y="293" font-size="24" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">当前：方法调研与接口梳理</text><text x="805" y="348" font-si