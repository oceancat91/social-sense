</g><g id="midterm-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="112" y="63" font-size="34" fill="#44546A" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">从多平台信息到可核查的辅助判断</text></g><g id="page-subtitle" data-pptx-bounds="75 108 1130 50"><rect x="75" y="108" width="1130" height="50" fill="none" /><text x="80" y="140" font-size="22" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">面向公共议题观察与传播研究，先解决证据和评价口径</text></g><g id="midterm-footer" data-pptx-bounds="70 680 1100 25" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="25" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" text-anchor="end" font-weight="normal">02 / 18</text></g><g id="problem-01" data-pptx-bounds="80 180 510 135"><rect x="80" y="180" width="510" height="135" fill="none" /><circle cx="112" cy="210" r="30" fill="#4472C4" /><text x="112" y="218" font-size="23" fill="#FFFFFF" font-family="Microsoft YaHei" text-anchor="middle" font-weight="bold">01</text><text x="162" y="213" font-size="28" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">平台数据难直接比较</text><text x="162" y="258" font-size="23" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">统一字段、时间和缺失标记<tspan x="162" dy="33.35">保留各平台的观测范围</tspan></text></g><g id="problem-02" data-pptx-bounds="80 340 510 135"><rect x="80" y="340" width="510" height="135" fill="none" /><circle cx="112" cy="370" r="30" fill="#4472C4" /><text x="112" y="378" font-size="23" fill="#FFFFFF" font-family="Microsoft YaHei" text-anchor="middle" font-weight="bold">02</text><text x="162" y="373" font-size="28" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">生成结论缺少核验</text><text x="162" y="418" font-size="23" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">让趋势、情绪和风险判断<tspan x="162" dy="33.35">回到可引用的观测证据</tspan></text></g><g id="problem-03" data-pptx-bounds="80 500 510 135"><rect x="80" y="500" width="510" height="135" fill="none" /><circle cx="112" cy="530" r="30" fill="#4472C4" /><text x="112" y="538" font-size="23" fill="#FFFFFF" font-family="Microsoft YaHei" text-anchor="middle" font-weight="bold">03</text><text x="162" y="533" font-size="28" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">预测价值需要实测</text><text x="162" y="578" font-size="23" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">同时报告数值误差、方向<tspan x="162" dy="33.35">尖峰检出与误报</tspan></text></g><g id="problem-04" data-pptx-bounds="690 180 510 135"><rect x="690" y="180" width="510" height="135" fill="none" /><circle cx="722" cy="210" r="30" fill="#4472C4" /><text x="722" y="218" font-size="23" fill="#FFFFFF" font-family="Microsoft YaHei" text-anchor="middle" font-weight="bold">04</text><text x="772" y="213" font-size="28" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">平台分歧难以解释</text><text x="772" y="258" font-size="23" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">对齐时间，再比较立场与声量<tspan x="772" dy="33.35">统计差异仍需事件证据</tspan></text></g><g id="problem-05" data-pptx-bounds="690 340 510 135"><rect x="690" y="340" width="510" height="135" fill="none" /><circle cx="722" cy="370" r="30" fill="#4472C4" /><text x="722" y="378" font-size="23" fill="#FFFFFF" font-family="Microsoft YaHei" text-anchor="middle" font-weight="bold">05</text><text x="772" y="373" font-size="28" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">传播关系尚待补齐</text><text x="772" y="418" font-size="23" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">现有相关性不等于因果传播<tspan x="772" dy="33.35">以可追溯关系样本推进溯源</tspan></text></g><g id="problem-value" data-pptx-bounds="690 525 510 112"><rect x="690" y="525" width="510" height="112" fill="none" /><rect x="690" y="525" width="510" height="112" fill="#EDF2F8" /><text x="714" y="565" font-size="22" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">本阶段定位</text><text x="714" y="605" font-size="25" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">可运行原型 + 可复核研究记录</text></g></svg>