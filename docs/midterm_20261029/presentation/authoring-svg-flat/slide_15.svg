<g id="midterm-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="112" y="63" font-size="34" fill="#44546A" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">备份｜文献启发与当前实现的边界</text></g><g id="page-subtitle" data-pptx-bounds="75 108 1130 50"><rect x="75" y="108" width="1130" height="50" fill="none" /><text x="80" y="140" font-size="22" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">文献支持研究设计，不自动构成本项目的性能证据</text></g><g id="midterm-footer" data-pptx-bounds="70 680 1100 25" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="25" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" text-anchor="end" font-weight="normal">14 / 18  备份</text></g><g id="paper-map-0" data-pptx-bounds="70 180 715 98"><rect x="70" y="180" width="715" height="98" fill="none" /><rect x="70" y="180" width="715" height="98" fill="#EDF2F8" /><text x="90" y="214" font-size="25" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">DLinear / xPatch [3,4]</text><text x="90" y="256" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">分解、线性基线与 PatchCNN；项目扩展四分量路径。</text></g><g id="paper-map-1" data-pptx-bounds="70 292 715 98"><rect x="70" y="292" width="715" height="98" fill="none" /><rect x="70" y="292" width="715" height="98" fill="#EDF2F8" /><text x="90" y="326" font-size="25" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">Mamba / PELT [5,6]</text><text x="90" y="368" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">选择性状态与变点建模；项目采用轻量实现与事件信号。</text></g><g id="paper-map-2" data-pptx-bounds="70 404 715 98"><rect x="70" y="404" width="715" height="98" fill="none" /><rect x="70" y="404" width="715" height="98" fill="#EDF2F8" /><text x="90" y="438" font-size="25" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">RAG / ReAct [7,10]</text><text x="90" y="480" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">外部证据与行动反馈；项目以契约和规则约束生成。</text></g><g id="paper-map-3" data-pptx-bounds="70 516 715 98"><rect x="70" y="516" width="715" height="98" fill="none" /><rect x="70" y="516" width="715" height="98" fill="#EDF2F8" /><text x="90" y="550" font-size="25" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">Time-LLM 与消融研究 [8,9]</text><text x="90" y="592" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">文本或大模型的价值必须独立消融，不能先验假定。</text></g><g id="scope-distinction" data-pptx-bounds="825 180 385 206"><rect x="825" y="180" width="385" height="206" fill="none" /><rect x="825" y="180" width="385" height="206" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.2" rx="8" ry="8" /><line x1="828" y1="183" x2="828" y2="383" stroke="#4472C4" stroke-width="5" /><text x="849" y="220" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">已实现 ≠ 已证明</text><text x="849" y="265" font-size="22" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">框架与代码可检查<tspan x="849" dy="34.1">相对性能仍需统一基线</tspan><tspan x="849" dy="34.1">回音室需互动网络证据 [1]</tspan></text></g><g id="missing-evaluation" data-pptx-bounds="825 415 385 206"><rect x="825" y="415" width="385" height="206" fill="none" /><rect x="825" y="415" width="385" height="206" fill="#FFFFFF" stroke="#0D3745" stroke-width="1.2" rx="8" ry="8" /><line x1="828" y1="418" x2="828" y2="618" stroke="#0D3745" stroke-width="5" /><text x="849" y="455" font-size="27" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">待完成的验证</text><text x="849" y="500" font-size="22" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">分量 / 文本 / 路由消融<tspan x="849" dy="34.1">跨话题与滚动时间评估</tspan><tspan x="849" dy="34.1">传播关系与标注样本 [2]</tspan></text></g></svg>