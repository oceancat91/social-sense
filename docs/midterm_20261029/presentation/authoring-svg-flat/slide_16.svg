<g id="midterm-header" data-pptx-bounds="95 16 815 83" data-pptx-role="header"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="112" y="63" font-size="34" fill="#44546A" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">项目特色在于证据约束与可验证的系统组合</text></g><g id="page-subtitle" data-pptx-bounds="75 108 1130 50"><rect x="75" y="108" width="1130" height="50" fill="none" /><text x="80" y="140" font-size="22" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">借鉴基础方法，明确工程贡献；算法优势由实验检验</text></g><g id="midterm-footer" data-pptx-bounds="70 680 1100 25" data-pptx-role="footer"><rect x="70" y="680" width="1100" height="25" fill="none" /><text x="76" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">SocialSense  ·  创新训练类中期答辩</text><text x="1155" y="700" font-size="13" fill="#64748B" font-family="Microsoft YaHei" text-anchor="end" font-weight="normal">09 / 18</text></g><g id="innovation-statement" data-pptx-bounds="65 185 365 450"><rect x="65" y="185" width="365" height="450" fill="none" /><rect x="65" y="185" width="365" height="450" fill="#EDF2F8" /><text x="96" y="246" font-size="31" fill="#0D3745" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">面向舆情任务</text><text x="96" y="302" font-size="33" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">证据可追查<tspan x="96" dy="59.4">模块可替换</tspan><tspan x="96" dy="59.4">结果可复核</tspan></text><text x="96" y="565" font-size="21" fill="#64748B" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">定位：方法探索与工程实现<tspan x="96" dy="30.45">不主张基础算法首创</tspan></text></g><g id="innovation-0" data-pptx-bounds="470 185 740 98"><rect x="470" y="185" width="740" height="98" fill="none" /><circle cx="489" cy="205" r="8" fill="#4472C4" /><text x="514" y="215" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">证据校准贯穿分析链</text><text x="514" y="259" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">受 ReAct / RAG 启发，以数据契约和规则核验落地 [7,10]</text></g><g id="innovation-1" data-pptx-bounds="470 298 740 98"><rect x="470" y="298" width="740" height="98" fill="none" /><circle cx="489" cy="318" r="8" fill="#4472C4" /><text x="514" y="328" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">分量编码面向突发热度</text><text x="514" y="372" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">借鉴 DLinear / xPatch / Mamba，扩展四分量路径 [3–6]</text></g><g id="innovation-2" data-pptx-bounds="470 411 740 98"><rect x="470" y="411" width="740" height="98" fill="none" /><circle cx="489" cy="431" r="8" fill="#4472C4" /><text x="514" y="441" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">轻量交付接受行为验证</text><text x="514" y="485" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">数值包等价性与文本收益分开评价，保留负结果 [9]</text></g><g id="innovation-3" data-pptx-bounds="470 524 740 98"><rect x="470" y="524" width="740" height="98" fill="none" /><circle cx="489" cy="544" r="8" fill="#4472C4" /><text x="514" y="554" font-size="27" fill="#4472C4" font-family="Microsoft YaHei" text-anchor="start" font-weight="bold">交互界面支持人工复核</text><text x="514" y="598" font-size="20" fill="#243446" font-family="Microsoft YaHei" text-anchor="start" font-weight="normal">将来源、范围和研究记录组织到档案视图</text></g></svg>