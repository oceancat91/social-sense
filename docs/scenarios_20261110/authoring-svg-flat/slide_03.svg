<g id="three-scenario-heading" data-pptx-bounds="95 16 815 83"><rect x="95" y="16" width="815" height="83" fill="none" /><text x="110" y="63" font-family="Microsoft YaHei" font-size="33" font-weight="bold" fill="#44546A">应用场景：三类议题，共用同一技术框架</text></g><g id="three-scenario-subtitle" data-pptx-bounds="75 106 1130 44"><rect x="75" y="106" width="1130" height="44" fill="none" /><text x="80" y="137" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#64748B">从消费争议到综艺走红、游戏社群，研究信息从何而来、如何扩散以及后续怎样变化</text></g><g id="scenario-0" data-pptx-bounds="65 169 370 435"><rect x="65" y="169" width="370" height="435" fill="none" /><rect x="65" y="169" width="370" height="435" rx="6" ry="6" fill="#FFFFFF" stroke="#B7C9E2" stroke-width="1.1" /><rect x="66" y="170" width="368" height="53" fill="#EDF2F8" /><text x="85" y="205" font-family="Microsoft YaHei" font-size="19.5" font-weight="bold" fill="#4472C4">01  社会公共议题</text><text x="85" y="257" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#0D3745">西贝“预制菜”争议</text><text x="85" y="294" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#4472C4">消费者知情权与品牌信任</text><text x="85" y="334" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#243446">个人发声与企业回应交织，<tspan x="85" dy="30.03">争论从菜品扩展至知情权、</tspan><tspan x="85" dy="30.03">定价与品牌信任，呈现多方</tspan><tspan x="85" dy="30.03">立场分歧与反复传播。</tspan></text><line x1="85" y1="439" x2="415" y2="439" stroke="#D6E0EB" stroke-width="1" /><text x="85" y="469" font-family="Microsoft YaHei" font-size="20.5" font-weight="bold" fill="#0D3745">研究切入</text><text x="85" y="503" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#243446">核对原帖、回应和媒体转述；<tspan x="85" dy="29.4">比较平台立场与热度变化，</tspan><tspan x="85" dy="29.4">识别关键节点及再升温线索。</tspan></text><text x="85" y="588" font-family="Microsoft YaHei" font-size="16.5" font-weight="normal" fill="#4472C4"><a href="https://finance.cnr.cn/ycbd/20250915/t20250915_527362854.shtml"><tspan text-decoration="underline">报道：央广网</tspan></a></text><text x="245" y="588" font-family="Microsoft YaHei" font-size="16.5" font-weight="normal" fill="#4472C4"><a href="https://opinion.cctv.com/2026/03/03/ARTI9m58PmwiNfBHSBoNEoHL260303.shtml"><tspan text-decoration="underline">央视网</tspan></a></text></g><g id="scenario-1" data-pptx-bounds="455 169 370 435"><rect x="455" y="169" width="370" height="435" fill="none" /><rect x="455" y="169" width="370" height="435" rx="6" ry="6" fill="#FFFFFF" stroke="#B7C9E2" stroke-width="1.1" /><rect x="456" y="170" width="368" height="53" fill="#EDF2F8" /><text x="475" y="205" font-family="Microsoft YaHei" font-size="19.5" font-weight="bold" fill="#4472C4">02  文化娱乐传播</text><text x="475" y="257" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#0D3745">《后会友期》综艺</text><text x="475" y="294" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#4472C4">内容走红与热度延续</text><text x="475" y="334" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#243446">从节目话题到切片和二创，<tspan x="475" dy="30.03">观察内容如何跨平台扩散；</tspan><tspan x="475" dy="30.03">区分短时爆发、持续关注</tspan><tspan x="475" dy="30.03">与再次传播的不同阶段。</tspan></text><line x1="475" y1="439" x2="805" y2="439" stroke="#D6E0EB" stroke-width="1" /><text x="475" y="469" font-family="Microsoft YaHei" font-size="20.5" font-weight="bold" fill="#0D3745">研究切入</text><text x="475" y="503" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#243446">关联话题出处与扩散顺序；<tspan x="475" dy="29.4">结合历史热度预测后续变化，</tspan><tspan x="475" dy="29.4">辅助内容复盘与受众研究。</tspan></text><text x="475" y="588" font-family="Microsoft YaHei" font-size="16.5" font-weight="normal" fill="#64748B">用户指定案例 · 事件样本待补齐</text></g><g id="scenario-2" data-pptx-bounds="845 169 370 435"><rect x="845" y="169" width="370" height="435" fill="none" /><rect x="845" y="169" width="370" height="435" rx="6" ry="6" fill="#FFFFFF" stroke="#B7C9E2" stroke-width="1.1" /><rect x="846" y="170" width="368" height="53" fill="#EDF2F8" /><text x="865" y="205" font-family="Microsoft YaHei" font-size="19.5" font-weight="bold" fill="#4472C4">03  游戏社群互动</text><text x="865" y="257" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#0D3745">《明日方舟》梗传播</text><text x="865" y="294" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#4472C4">积极传播与创作认可</text><text x="865" y="334" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#243446">以“酸橙”相关二创为例，<tspan x="865" dy="30.03">连接素材分享、玩家改写</tspan><tspan x="865" dy="30.03">和跨圈传播，关注创作来源</tspan><tspan x="865" dy="30.03">与官方、玩家的互动反馈。</tspan></text><line x1="865" y1="439" x2="1195" y2="439" stroke="#D6E0EB" stroke-width="1" /><text x="865" y="469" font-family="Microsoft YaHei" font-size="20.5" font-weight="bold" fill="#0D3745">研究切入</text><text x="865" y="503" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#243446">梳理原始表达、变体与引用；<tspan x="865" dy="29.4">观察传播热度和语境变化，</tspan><tspan x="865" dy="29.4">支持创作认可与社区沟通。</tspan></text><text x="865" y="588" font-family="Microsoft YaHei" font-size="16.5" font-weight="normal" fill="#4472C4"><a href="https://www.taptap.cn/moment/834126362733185189"><tspan text-decoration="underline">素材分享</tspan></a></text><text x="1009" y="588" font-family="Microsoft YaHei" font-size="16.5" font-weight="normal" fill="#4472C4"><a href="https://www.taptap.cn/moment/832223722998859956"><tspan text-decoration="underline">创作征集</tspan></a></text></g><g id="shared-research" data-pptx-bounds="70 619 1135 58"><rect x="70" y="619" width="1135" height="58" fill="none" /><rect x="70" y="619" width="1135" height="58" fill="#EDF2F8" /><text x="88" y="645" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#4472C4">共同研究链路：路径溯源 → 热度走向预测 → 三维等高线与证据联动（规划）</text><text x="88" y="669" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#64748B">案例用于说明应用需求；专项效果需事件样本验证，完整传播关系及三维山峰图仍需补齐。</text></g></svg>