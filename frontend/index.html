<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e5e1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sense Lab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Sense Lab — Synthesize Information Analysis OS. 交互式三维舆情档案终端。"
    />
    <title>SENSE LAB · ANALYSIS OS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="viewport"><div id="stage"></div></main>
    <div id="boot-fallback" hidden>
      <strong>浏览器版本过低</strong>
      <p>本终端需要较新的浏览器才能运行。请升级系统与 Safari，或改用 Chrome、Edge 打开。</p>
    </div>
    <script>
      // 模块脚本若因语法过新而解析失败，主程序一行都不会执行、页面只剩白屏。
      // 这里用经典脚本兜底：若干秒后仍未收到启动信号，就把白屏换成可读提示。
      setTimeout(function () {
        if (!window.__senseLabBooted) {
          var el = document.getElementById("boot-fallback");
          if (el) el.hidden = false;
        }
      }, 9000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
