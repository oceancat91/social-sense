server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location = / {
        return 302 /app/;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 预测仪表盘（Flask）。与宿主机部署用的 deploy/nginx-social-sense.conf 保持一致：
    # /api/v1/forecast/* 是全项目唯一不加 JWT 的业务接口，必须在网关层加密码，
    # 否则部署到公网即等于公开模型产出，且 /status 会触发加载模型（内存风险）。
    # 账号密码文件由 deploy/setup-forecast-auth.sh 生成，挂载到 /etc/nginx/ 下。
    location /forecast {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前缀比上面的 /api/ 更长，Nginx 按最长前缀匹配，会优先命中这里。
    location /api/v1/forecast/ {
        auth_basic           "Social Sense Forecast";
        auth_basic_user_file /etc/nginx/.htpasswd-forecast;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
